[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-readiness"
version = "0.1.0"
description = "Assess how AI coding agent friendly your repository is"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
pdf = [
    "xhtml2pdf>=0.2.16",
    "markdown>=3.5",
]

[project.scripts]
ai-readiness = "ai_readiness.cli:app"

[tool.setuptools.packages.find]
include = ["ai_readiness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
