name: Adoption Tracking

on:
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 8am UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  track-adoption:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Needed to push adoption data back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI Readiness Tool
        run: pip install -e .

      - name: Fetch adoption data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "Fetching adoption stats for $REPO..."
          ai-readiness adoption fetch --repo "$REPO"

      - name: Commit and push adoption data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet adoption_data/; then
            echo "No changes to adoption data — skipping commit."
          else
            git add adoption_data/
            git commit -m "chore: update weekly adoption data [skip ci]

Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
            git push
            echo "✅ Adoption data committed and pushed."
          fi
