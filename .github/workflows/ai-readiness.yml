name: AI Readiness Check

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      repo_url:
        description: "Repository URL to assess (leave empty for this repo)"
        required: false
        type: string

jobs:
  ai-readiness:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI Readiness Tool
        run: pip install -e .

      - name: Run AI Readiness Check
        id: check
        run: |
          TARGET="${{ inputs.repo_url || '.' }}"
          ai-readiness check "$TARGET" --no-llm --format json > report.json 2>/dev/null
          ai-readiness check "$TARGET" --no-llm --format markdown > report.md 2>/dev/null
          
          SCORE=$(python -c "import json; print(json.load(open('report.json'))['overall_score'])")
          echo "score=$SCORE" >> $GITHUB_OUTPUT

      - name: Comment PR with report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            
            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const marker = '<!-- ai-readiness-report -->';
            const body = `${marker}\n${report}`;
            const existing = comments.find(c => c.body.includes(marker));
            
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-readiness-report
          path: |
            report.json
            report.md
